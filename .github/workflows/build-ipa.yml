name: Build iOS App

on:
  push:
    branches: [ v4, main ] # Adjust to your active branch name

jobs:
  build:
    name: Build and Archive iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Build Archive
        run: |
          xcodebuild -project CiderRemote.xcodeproj \
            -scheme CiderRemote \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $RUNNER_TEMP/CiderRemote.xcarchive \
            archive
