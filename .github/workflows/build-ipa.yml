name: Build iOS App

on:
  push:
    branches: [ v4, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned iOS IPA
    runs-on: macos-latest

    env:
      XCODE_PROJECT: "Cider Remote.xcodeproj"
      XCODE_SCHEME: "Cider Remote"
      ARCHIVE_PATH: ${{ runner.temp }}/CiderRemote.xcarchive
      IPA_OUTPUT: ${{ runner.temp }}/CiderRemote-unsigned.ipa

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Exclude duplicate legacy Queue source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          project = Path("Cider Remote.xcodeproj/project.pbxproj")
          contents = project.read_text()
          exception_id = "C0FFEE000000000000000001"
          marker = "/* End PBXFileSystemSynchronizedBuildFileExceptionSet section */"
          root_group = '''\t\tB998C12B2EA2B54500FF1517 /* Cider Remote */ = {
          \t\t\tisa = PBXFileSystemSynchronizedRootGroup;
          \t\t\tpath = "Cider Remote";
          \t\t\tsourceTree = "<group>";
          \t\t};'''
          root_group_with_exception = f'''\t\tB998C12B2EA2B54500FF1517 /* Cider Remote */ = {{
          \t\t\tisa = PBXFileSystemSynchronizedRootGroup;
          \t\t\texceptions = (
          \t\t\t\t{exception_id} /* Exclude legacy Queue.swift from app target */,
          \t\t\t);
          \t\t\tpath = "Cider Remote";
          \t\t\tsourceTree = "<group>";
          \t\t}};'''
          exception = f'''\t\t{exception_id} /* Exclude legacy Queue.swift from app target */ = {{
          \t\t\tisa = PBXFileSystemSynchronizedBuildFileExceptionSet;
          \t\t\tmembershipExceptions = (
          \t\t\t\t"Data/Queue.swift",
          \t\t\t);
          \t\t\ttarget = FA14E3462C7CA1C200904A49 /* Cider Remote */;
          \t\t}};
          '''

          if exception_id not in contents:
              if root_group not in contents or marker not in contents:
                  raise SystemExit("Could not find expected Xcode project sections; refusing to alter the project")
              contents = contents.replace(root_group, root_group_with_exception, 1)
              contents = contents.replace(marker, exception + marker, 1)
              project.write_text(contents)
          PY

      - name: Build unsigned archive
        run: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$ARCHIVE_PATH/Products/Applications/Cider Remote.app"
          test -d "$APP_PATH" || { echo "App not found at $APP_PATH"; exit 1; }

          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"

          cd "$RUNNER_TEMP"
          zip -qr "$IPA_OUTPUT" Payload

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cider-Remote-unsigned-IPA
          path: ${{ runner.temp }}/CiderRemote-unsigned.ipa
          if-no-files-found: error
